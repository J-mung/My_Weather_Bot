name: Automation PR

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: "자동화 변경이 들어 있는 브랜치"
        required: true
      base_branch:
        description: "draft PR의 기준 브랜치"
        required: false
        default: "main"
      task_id:
        description: "PR 제목/본문에 표시할 짧은 작업 식별자"
        required: true
      summary:
        description: "PR 본문에 표시할 작업 요약"
        required: true
      create_pr:
        description: "검증 성공 시 draft PR 생성"
        required: false
        type: boolean
        default: true

# contents:write는 향후 스크립트 전용 자동화 브랜치의 ref 확인/푸시에 대비해 둔다.
# pull-requests:write는 draft PR 생성과 COMMENT 리뷰 제출에 필요하다.
# issues:write는 리뷰 제출이 불가할 때 PR 타임라인 댓글/실패 알림 용도로 남겨 둔다.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: automation-pr-${{ github.event.inputs.head_branch }}
  cancel-in-progress: false

jobs:
  open-draft-pr:
    name: 브랜치를 검증하고 draft PR 열기
    runs-on: ubuntu-latest

    steps:
      - name: 대상 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.head_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 후보 브랜치 검증
        id: verify
        run: |
          set -euo pipefail
          npm run verify | tee verify.log
          {
            echo 'result=success'
            echo 'log<<EOF'
            tail -n 80 verify.log
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 브랜치 변경 확인
        id: diff
        env:
          BASE_BRANCH: ${{ github.event.inputs.base_branch }}
          HEAD_BRANCH: ${{ github.event.inputs.head_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH" "$HEAD_BRANCH"
          if git diff --quiet "origin/$BASE_BRANCH...origin/$HEAD_BRANCH"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "origin/$BASE_BRANCH와 origin/$HEAD_BRANCH 사이에 변경이 없습니다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo 'files<<EOF'
            git diff --name-only "origin/$BASE_BRANCH...origin/$HEAD_BRANCH"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: draft PR과 자동화 리뷰 생성
        if: ${{ github.event.inputs.create_pr == 'true' && steps.diff.outputs.has_changes == 'true' }}
        uses: actions/github-script@v7
        env:
          BASE_BRANCH: ${{ github.event.inputs.base_branch }}
          HEAD_BRANCH: ${{ github.event.inputs.head_branch }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          TASK_SUMMARY: ${{ github.event.inputs.summary }}
          VERIFY_LOG: ${{ steps.verify.outputs.log }}
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = process.env.BASE_BRANCH;
            const head = process.env.HEAD_BRANCH;
            const taskId = process.env.TASK_ID;
            const taskSummary = process.env.TASK_SUMMARY;
            const verifyLog = process.env.VERIFY_LOG || 'npm run verify가 성공했습니다.';
            const changedFiles = (process.env.CHANGED_FILES || '')
              .split('\n')
              .map((file) => file.trim())
              .filter(Boolean);

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });

            const title = `🤖 자동화: ${taskId}`;
            const body = [
              '## 요약',
              '',
              taskSummary,
              '',
              '## 자동화 실행 정보',
              '',
              `- 작업 ID: \`${taskId}\``,
              `- 대상 브랜치: \`${head}\``,
              `- 기준 브랜치: \`${base}\``,
              '- 운영 모드: draft PR 생성, 자동 승인 없음, 자동 병합 없음',
              '',
              '## 변경 파일',
              '',
              changedFiles.length > 0
                ? changedFiles.map((file) => `- \`${file}\``).join('\n')
                : '- 변경 파일 목록을 가져오지 못했습니다.',
              '',
              '## 검증 결과',
              '',
              '```text',
              verifyLog.slice(-6000),
              '```',
              '',
              '## 사람/Codex 확인 체크리스트',
              '',
              '- [ ] 생성된 diff가 요청한 작업 범위와 일치하는지 확인한다.',
              '- [ ] secret/env/deploy 설정이 의도치 않게 바뀌지 않았는지 확인한다.',
              '- [ ] 이 PR의 CI가 통과했는지 확인한다.',
              '- [ ] Ready 전환 또는 병합 전에 Codex 리뷰나 사람 리뷰를 확인한다.',
            ].join('\n');

            const pr = existing[0] ?? (await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body,
              draft: true,
              maintainer_can_modify: true,
            })).data;

            if (existing[0]) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
            }

            const reviewBody = [
              '## 자동화 리뷰',
              '',
              `작업 \`${taskId}\`은 자동화 검증을 통과했습니다.`,
              '',
              '- `npm run verify`: 통과',
              '- 자동 승인: 수행하지 않음',
              '- 자동 병합: 수행하지 않음',
              '- 다음 단계: 병합 전 사람/Codex 리뷰 확인 필요',
            ].join('\n');

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pr.number,
              event: 'COMMENT',
              body: reviewBody,
            });

            await core.summary
              .addHeading('자동화 PR 생성 완료')
              .addLink(`#${pr.number} ${pr.title}`, pr.html_url)
              .addRaw('\n')
              .addList([
                `Head: ${head}`,
                `Base: ${base}`,
                '검증: npm run verify 통과',
                '리뷰: COMMENT 리뷰 등록 완료',
              ])
              .write();

      - name: PR 생성 생략 보고
        if: ${{ github.event.inputs.create_pr != 'true' || steps.diff.outputs.has_changes != 'true' }}
        run: |
          {
            echo "## 자동화 PR을 생성하지 않았습니다"
            echo ""
            echo "- create_pr: ${{ github.event.inputs.create_pr }}"
            echo "- has_changes: ${{ steps.diff.outputs.has_changes }}"
            echo "- verify: 통과"
          } >> "$GITHUB_STEP_SUMMARY"
